# Netlify frontend build config.
# The React app is static (HashRouter) and talks to the backend API via the
# REACT_APP_API_BASE_URL env var. Set that in the Netlify UI (Site settings ->
# Environment) to your Render backend URL, e.g.
#   REACT_APP_API_BASE_URL = "https://portfolio-api.onrender.com"
[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  # Placeholder — override in the Netlify UI with your real backend URL.
  REACT_APP_API_BASE_URL = "https://your-render-url.onrender.com"
